<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Mi Mi yêu 💖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay"></div>
    
    <div class="title" id="main-title">✨ Chạm vào để mở điều kỳ diệu ✨</div>

    <div class="container">
        <div class="envelope-wrapper">
            <div class="envelope" id="env" onclick="openLetter()">
                <div class="flap"></div>
                <div class="letter">
                    <div class="letter-content">
                        <div class="rose-icon">🌹</div>
                        <div id="typing"></div>
                        <div class="photo-frame">
                            <img src="https://raw.githubusercontent.com/HoangHai3061/images/main/z7592333483782_1f925d850a28f245d3181ec087748dc3.jpg" alt="Memory">
                        </div>
                        <p class="signature">Người yêu em ❤️</p>
                        <p class="signature">HẢI</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-reset" onclick="resetCard()">Làm mới thiệp</button>

    <audio id="music" loop>
        <source src="https://www.chosic.com/wp-content/uploads/2021/04/Rain-And-Flowers-Free-Background-Music.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
